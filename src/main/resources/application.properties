spring.jpa.properties.jadira.usertype.autoRegisterUserTypes=true
spring.jpa.show-sql=false

#  JACKSON
spring.jackson.joda-date-time-format=yyyy-MM-dd'T'HH:mm:ss.SSSZ
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.mapper.accept-case-insensitive-properties=true

#  DATASOURCE PROXY (LOGGING)
decorator.datasource.enabled=true
decorator.datasource.datasource-proxy.query.enable-logging=false
decorator.datasource.datasource-proxy.query.log-level=INFO

#  LOGGING
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X] %-5level %logger{36}:%line - %msg%n
